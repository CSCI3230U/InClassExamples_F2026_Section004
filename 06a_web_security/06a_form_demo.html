<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order form - Lecture 06a (D9: the server is the gate)</title>
    <!-- Served by 06a_form_server.py, which also handles the POST -->
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      label { display: block; margin: 0.75rem 0 0.2rem; font-weight: 600; }
      input, select, textarea { width: 100%; padding: 0.4rem; font: inherit; box-sizing: border-box; }
      .rules { color: #666; font-weight: 400; font-size: 0.85em; }
      .total { font-size: 1.2rem; margin: 1rem 0; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; }
      code { background: #f3eee3; padding: 0 3px; }
      .note { border-left: 3px solid #c9b79c; padding: 0.5rem 0.75rem; background: #faf7f2; }
    </style>
  </head>
  <body>
    <h1>Course swag - place an order</h1>

    <p class="note">
      Every check on this page is <strong>client-side</strong>:
      <code>required</code>, <code>type</code>, <code>min</code>/<code>max</code>,
      <code>maxlength</code>, <code>pattern</code>, and a JavaScript submit handler.
      The browser enforces it, but it can be bypassed.
    </p>

    <form id="order" method="post" action="/api/order">
      <label for="email">Email <span class="rules">required · type=email</span></label>
      <input id="email" name="email" type="email" required maxlength="254" />

      <label for="item">Item <span class="rules">a fixed list of three</span></label>
      <select id="item" name="item" required>
        <option value="sticker-pack" data-price="5.00">Sticker pack - $5.00</option>
        <option value="mug" data-price="12.50">Mug - $12.50</option>
        <option value="hoodie" data-price="45.00">Hoodie - $45.00</option>
      </select>

      <label for="quantity">Quantity <span class="rules">required · min=1 · max=10</span></label>
      <input id="quantity" name="quantity" type="number" value="1" min="1" max="10" required />

      <label for="coupon">Coupon <span class="rules">optional · pattern=SAVE[0-9]{2}</span></label>
      <input id="coupon" name="coupon" type="text" pattern="SAVE[0-9]{2}" placeholder="SAVE10" />

      <label for="notes">Gift note <span class="rules">maxlength=80</span></label>
      <textarea id="notes" name="notes" rows="2" maxlength="80"></textarea>

      <!-- The classic mistake: the price travels with the request, so the client
           gets to say what things cost. -->
      <input id="price" name="price" type="hidden" value="5.00" />

      <p class="total">Total: <strong id="total">$5.00</strong></p>

      <button type="submit">Place order</button>
    </form>

    <script>
      const form = document.querySelector("#order");
      const item = document.querySelector("#item");
      const qty = document.querySelector("#quantity");
      const price = document.querySelector("#price");
      const total = document.querySelector("#total");

      const unitPrice = () => Number(item.selectedOptions[0].dataset.price);

      function recalculate() {
        price.value = unitPrice().toFixed(2);
        total.textContent = "$" + (unitPrice() * Number(qty.value || 0)).toFixed(2);
      }

      item.addEventListener("change", recalculate);
      qty.addEventListener("input", recalculate);
      recalculate();

      // client-side validation
      form.addEventListener("submit", (e) => {
        const n = Number(qty.value);
        if (!Number.isInteger(n) || n < 1 || n > 10) {
          e.preventDefault();
          alert("Quantity must be a whole number from 1 to 10.");
        }
      });
    </script>
  </body>
</html>
