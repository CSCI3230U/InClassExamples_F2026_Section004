<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XSS demo - Lecture 06a</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      textarea { width: 100%; }
      .out { border: 1px solid #ccc; padding: 0.75rem; margin: 0.5rem 0; min-height: 2rem; }
      button { margin-right: 0.5rem; }
      code { background: #f3eee3; padding: 0 3px; }
    </style>
    <meta name="Content-Security-Policy" content="script-src 'nonce-demo123'; require-trusted-types-for 'script'; trusted-types sanitizer dompurify">
  </head>
  <body>
    <h1>“Post a comment”</h1>

    <p>Try: <code>&lt;img src=x onerror="alert('XSS!')"&gt;</code></p>
    <textarea id="comment" rows="3">&lt;img src=x onerror="alert('XSS!')"&gt;</textarea>

    <p>
      <button id="unsafe">Render with innerHTML (unsafe)</button>
      <button id="sanitized">Sanitized through our policy (probably safe)</button>
      <button id="safe">Render with textContent (safe)</button>
    </p>

    <div class="out" id="out"></div>

    <script nonce="demo123">
const value = () => document.querySelector('#comment').value;

const out = document.querySelector('#out');

const sanitizer = trustedTypes.createPolicy('sanitizer', {
  createHTML: (s) => DOMPurify.sanitize(s),
  createScript: (s) => new URL(s, location.href).origin === location.origin ? s : 'about:blank',
});

document.querySelector('#safe').addEventListener('click', (event) => {
  out.textContent = value();
});

document.querySelector('#unsafe').addEventListener('click', (event) => {
  out.innerHTML = value();
});

document.querySelector('#sanitized').addEventListener('click', (event) => {
  // you are here
  out.innerHTML = sanitizer.createHTML(value());
});
    </script>
  </body>
</html>
